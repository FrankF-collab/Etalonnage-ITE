<style>

:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#9aa5b1;--bd:#363d46;--ac:#6ea8ff;--red:#ff6b6b;color-scheme:dark}

body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;padding:12px}

.row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.row>span.l{width:110px;flex:none}.b{font-size:1.45em;font-weight:600;line-height:1}
.line{display:flex;gap:10px}.line>*{flex:1;min-width:0}.cap{margin-bottom:3px}.bpt{display:flex;gap:16px;flex-wrap:wrap}.bpt label{display:flex;align-items:center;gap:6px}.bpt label.x{text-decoration:line-through;text-decoration-color:#1f6feb;text-decoration-thickness:2px;color:var(--mu)}.sub .cam{margin-left:auto;padding:8px 12px}.sub svg{width:20px;height:20px;vertical-align:middle}
.sel{position:relative}.sel .v{display:block;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:2.5em;background:var(--card);text-align:center;font-weight:600}

.hd{font-weight:600;margin:12px 0 6px}
.ac{display:flex;align-items:center;gap:4px;flex:none;font-size:1.3em;font-weight:600;line-height:1}
.g3{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center}.g3 .c{text-align:center;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.btns .p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btns .g{background:#1f9d4d;color:#fff;border-color:#1f9d4d}.btns .r{background:#d12c2c;color:#fff;border-color:#d12c2c}
.btns .bl{background:#1f6feb;color:#fff;border-color:#1f6feb}.btns svg{width:20px;height:20px;vertical-align:middle}
#st{font-size:.85rem;color:var(--mu);margin-top:6px;min-height:1.2em}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sub button{padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}.sub button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.sp-hide{display:none!important}
#t0 .part>h3,#t1 .part>h3{display:none}
#wm{position:fixed;left:50%;width:min(100%,640px);transform:translateX(-50%);top:0;bottom:0;background:url(filigrane.svg) center/contain no-repeat;opacity:.13;pointer-events:none;z-index:5}:root[data-theme="dark"] #wm{opacity:.2}

<div class="btns"><button id="bImp" title="Importer" aria-label="Importer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13v6h14v-6"/><path d="M12 3v11M8 10l4 4 4-4"/></svg></button><button class="g" id="bSave" title="Enregistrer" aria-label="Enregistrer">💾</button><button id="bOpen" title="Ouvrir" aria-label="Ouvrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16M6 21V3h12v18"/><path d="M6 3l8 2.5v13L6 21z"/><path d="M11.5 12h.01"/></svg></button><button id="bClose" title="Fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><rect x="6" y="3" width="12" height="18"/><path d="M15 12h.01"/></svg></button><button class="bl" id="bXls" title="Exporter" aria-label="Exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13v6h14v-6"/><path d="M12 15V4M8 8l4-4 4 4"/></svg></button><button class="r" id="bDel" title="Supprimer" aria-label="Supprimer" style="margin-left:auto">🗑️</button></div><div id="cf"></div>

<div id="mdl" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="part" style="width:100%;max-width:420px;margin:0"><h3>Fichier Excel créé</h3><div class="cap">Envoyer par e-mail à :</div><input id="mail" type="email" placeholder="Adresse e-mail" autocomplete="email"><div class="btns"><button class="p" id="bSend">✉️ Envoyer</button><button id="bNo">Fermer</button></div><div id="mm" style="font-size:.85rem;color:var(--mu);margin-top:6px"></div></div></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem('ite:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('ite:'+k,v)}catch(e){}}};
function lab(t){return '<span class="b">'+t[0]+'</span>'+t.slice(1)}
const fm=t=>t.replace(/^(UA|UR|U0)(?=[+-]|$)/,a=>lab(a));
// 6 éléments de l'onglet Constitution : [id, libellé, colonne de départ] ; 1re partie en ligne 19, 2e partie en ligne 21
const ELT=[['em1','Émetteur','R'],['em2','TVA','AD'],['re1','TVR','AP'],['re2','Récepteur','BB'],['re3','BP.BRTA2 - KFRI - VDR','BN'],['re4','Relais de voie','BZ']];
const part=(cls,t,body)=>'<div class="part '+cls+'"><h3>'+t+'</h3>'+body+'</div>';
const field=(k,t,ex)=>'<div class="row"><span class="l">'+fm(t)+'</span><input data-k="'+k+'" autocomplete="off"'+(ex||'')+'></div>';
const int=(k,t)=>field(k,t,' inputmode="numeric"');
const num=(k,t,x)=>field(k,t,' inputmode="decimal"'+(x||''));
const ck=(k,t)=>'<div class="row"><input type="checkbox" data-k="'+k+'"><span>'+t+'</span></div>';
const BPN=['BP.BRTA2','KFRI','VDR','∅'];
const elt=([id,t])=>(id=='re3'?'<div class="hd bpt">'+BPN.map((n,i)=>'<label><input type="checkbox" data-k="c_re3_t'+(i+1)+'">'+n+'</label>').join('')+'</div>':'<div class="hd">'+t+'</div>')+'<div class="line"><input data-k="c_'+id+'_1" autocomplete="off" aria-label="'+t+' série"><input data-k="c_'+id+'_2" inputmode="numeric" autocomplete="off" aria-label="'+t+' numéro"></div>';
$('t0').innerHTML=part('','Émission',ELT.slice(0,2).map(elt).join(''))+part('','Réception',ELT.slice(2,4).map(elt).join(''))+part('','Relais & autre',ELT.slice(4).map(elt).join(''));

function sel(k,opts){return '<div class="sel"><span class="v"></span><select data-k="'+k+'"><option value=""></option>'+opts.map(o=>'<option value="'+o[0]+'">'+o+'</option>').join('')+'</select></div>'}
const rc=(k,t)=>'<div>'+t+'</div><input data-k="rc_'+k+'1" inputmode="decimal" autocomplete="off"><input data-k="rc_'+k+'2" inputmode="decimal" autocomplete="off">';
const XL=['Maintenance','Contrôle technique','Visite de sécurité','Essai de shunt','Vérification des reports de polarité','Vérification des connexions à la voie','État de surface du rail','Détection du rail cassé','Détection du joint brûlé'];
$('t1').innerHTML=part('','Éphéméride','<div class="line"><div><div class="cap">Date</div><input data-k="m_date" inputmode="numeric" placeholder="jj/mm/aaaa" maxlength="10"></div><div><div class="cap">Temps</div>'+sel('m_t1',['Chaud','Temp','Froid'])+'</div><div><div class="cap">Temps</div>'+sel('m_t2',['Sec','Normal','Humide'])+'</div></div>')
+part('','Terrain','<div class="row"><span class="l">U Alim</span><input data-k="m_ual" inputmode="decimal" autocomplete="off"><label class="ac">~<input type="checkbox" data-k="m_ac"></label><label class="ac">=<input type="checkbox" data-k="m_dc"></label></div>'
 +num('m_ua_p','UA+')+num('m_ua_m','UA-')+num('m_ur_p','UR+')+num('m_ur_m','UR-')
 +num('m_v1','V1 voie libre')+num('m_v2','V2 voie libre')+num('m_rv1','V1 rail cassé',' readonly placeholder="moyenne"')+num('m_rv2','V2 rail cassé',' readonly placeholder="moyenne"')
 +num('m_lib','Libre')+int('m_f','Fréquence')
 +'<div class="hd">Opérations</div>'+XL.map((t,i)=>ck('m_x'+(i+1),t)).join(''))
+part('','A vide',int('m_av_f','Fréquence')+num('m_av_p','U0+')+num('m_av_m','U0-'))
+part('','Rail cassé','<div class="g3"><div></div><div class="c">V1 (V)</div><div class="c">V2 (V)</div></div><div class="hd">Côté émission</div><div class="g3">'+rc('eg','File gauche')+rc('ed','File droite')+'</div><div class="hd">Côté réception</div><div class="g3">'+rc('rg','File gauche')+rc('rd','File droite')+'</div>');

const SUB={t0:[['em','Émission'],['re','Réception'],['bp','Relais & autre']],t1:[['eph','📅','Éphéméride'],['me','Terrain'],['av','A vide'],['rc','Rail cassé']]};
function initSub(t){const box=$(t),ps=[...box.querySelectorAll(':scope>.part,:scope>.wr')],nav=document.createElement('div');nav.className='sub';
 SUB[t].forEach(([id,n,ti],i)=>{ps[i].dataset.sp=id;const b=document.createElement('button');b.innerHTML=fm(n);if(ti)b.title=ti;b.dataset.sp=id;if(id=='pi')b.className='pi';b.onclick=()=>subshow(t,id);nav.appendChild(b)});box.prepend(nav);
 subshow(t,store.get('sub'+t)||SUB[t][0][0])}
['t0','t1'].forEach(initSub);
function subshow(t,id){const box=$(t);box.dataset.cur=id;box.querySelectorAll(':scope>.part,:scope>.wr').forEach(p=>p.classList.toggle('sp-hide',p.dataset.sp!=id));box.querySelectorAll('.sub button').forEach(b=>b.classList.toggle('on',b.dataset.sp==id));store.set('sub'+t,id)}

const names=['Constitution','Mesures'],TP=['t0','t1'];
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(n=='🔧')b.title='Outils';b.onclick=()=>show(i);b.id='tb'+i;$('tabs').appendChild(b)});
function show(i){names.forEach((_,j)=>{$(TP[j]).classList.toggle('on',i==j);$('tb'+j).classList.toggle('on',i==j)});store.set('tab',i)}
const gq=k=>document.querySelector('[data-k='+k+']');
const CK=Array.from({length:9},(_,i)=>'m_x'+(i+1)),NOK=['m_date','m_t1','m_t2','m_ac','m_dc',...CK];
const INTK=k=>k=='m_f'||k=='m_av_f';
const NUMK=k=>/^(m_|rc_)/.test(k)&&!NOK.includes(k);
const FM={zone:'BY12',m_date:'B98',m_t1:'G98',m_t2:'J98',m_ua_p:'S98',m_ua_m:'V98',m_ur_p:'Y98',m_ur_m:'AB98',m_v1:'AE98',m_v2:'AH98',m_rv1:'AK98',m_rv2:'AN98',m_lib:'AQ98',m_f:'AU98',m_av_f:'BH92',m_av_p:'BP92',m_av_m:'BZ92',
 rc_eg1:'Y77',rc_eg2:'AC77',rc_ed1:'Y78',rc_ed2:'AC78',rc_rg1:'Y79',rc_rg2:'AC79',rc_rd1:'Y80',rc_rd2:'AC80'};
ELT.forEach(([id,,c])=>{FM['c_'+id+'_1']=c+'19';FM['c_'+id+'_2']=c+'21'});
['AX','AZ','BB','BD','BF','BH','BJ','BL','BN'].forEach((c,i)=>FM['m_x'+(i+1)]=c+'98');
const CHK='✓';

const inputs=()=>[...document.querySelectorAll('[data-k]')];
function gather(){const o={zone:$('zone').value.trim()};inputs().forEach(e=>{o[e.dataset.k]=e.type=='checkbox'?(e.checked?'oui':''):e.value});return o}
function fill(o){$('zone').value=o.zone||'';inputs().forEach(e=>{const v=o[e.dataset.k]||'';if(e.type=='checkbox')e.checked=v=='oui';else e.value=v});calcRC(false);refresh()}
function calcRC(force){const avg=ks=>{const v=ks.map(k=>parseFloat(String(gq(k).value).replace(',','.'))).filter(x=>!isNaN(x));return v.length?String(Math.round((v.reduce((a,b)=>a+b,0)/v.length+Number.EPSILON)*100)/100).replace('.',','):''};
 [['m_rv1',['rc_eg1','rc_ed1','rc_rg1','rc_rd1']],['m_rv2',['rc_eg2','rc_ed2','rc_rg2','rc_rd2']]].forEach(([k,ks])=>{const a=avg(ks);if(a!==''||force)gq(k).value=a})}
function refresh(){document.querySelectorAll('.sel').forEach(s=>{s.querySelector('.v').textContent=s.querySelector('select').value});const bp=[...document.querySelectorAll('.bpt input')],on=bp.map(i=>i.checked);bp.forEach((i,q)=>i.parentNode.classList.toggle('x',q<3&&(on[3]||(on[0]||on[1]||on[2])&&!on[q])))}
document.addEventListener('input',e=>{const t=e.target,k=(t.dataset||{}).k||'';
 if(k=='m_date'){const d=t.value.replace(/\D/g,'').slice(0,8);t.value=d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2}\/\d{2})(\d)/,'$1/$2')}
 if(/^c_.*_1$/.test(k))t.value=t.value.replace(/[^\p{L} \-]/gu,'');
 if(/^c_.*_2$/.test(k))t.value=t.value.replace(/\D/g,'');
 if(k&&INTK(k))t.value=t.value.replace(/\D/g,'');
 else if(k&&NUMK(k)){let v=t.value.replace(/[^0-9.,]/g,'');const i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,'').slice(0,2);t.value=v}
 if(/^rc_/.test(k))calcRC(true);
 refresh();store.set('draft',JSON.stringify(gather()))});
document.addEventListener('change',e=>{const t=e.target,k=(t.dataset||{}).k||'';
 if(/^c_re3_t\d$/.test(k)&&t.checked)[1,2,3,4].forEach(i=>{const e=gq('c_re3_t'+i);if(e!==t)e.checked=false});
 if(k=='m_ac'&&t.checked)gq('m_dc').checked=false;if(k=='m_dc'&&t.checked)gq('m_ac').checked=false;
 refresh();store.set('draft',JSON.stringify(gather()))});

const R=()=>{try{return JSON.parse(store.get('recs')||'{}')}catch(e){return {}}};
let cur=null;
const say=m=>{$('st').textContent=m};
function list(sel){const s=$('recs');s.innerHTML='<option value="">— Enregistrements —</option>';Object.keys(R()).sort().forEach(k=>{const o=document.createElement('option');o.textContent=k;s.appendChild(o)});if(sel)s.value=sel}
let curSrc=null;
function save(){const o=gather(),k=recName(o);if(!k){say('Saisissez un Zone n° pour enregistrer.');return false}const r=R();o.src=curSrc||(r[k]||{}).src;if(!o.src)delete o.src;r[k]=o;store.set('recs',JSON.stringify(r));cur=k;list(k);say('Enregistrement « '+k+' » sauvegardé.');return true}
$('bSave').onclick=save;
$('bOpen').onclick=()=>{const k=$('recs').value;if(!k)return say('Choisissez un enregistrement.');fill(R()[k]);cur=k;curSrc=R()[k].src||null;say('Enregistrement « '+k+' » ouvert.')};
$('bClose').onclick=()=>{if($('zone').value.trim())save();fill({});cur=null;curSrc=null;store.set('draft','{}');$('recs').value='';say('Enregistrement fermé.')};
$('bDel').onclick=()=>{const k=$('recs').value||cur;if(!k)return say('Choisissez un enregistrement.');const c=$('cf');
 c.innerHTML='<div style="margin-top:8px">Supprimer « '+k.replace(/</g,'&lt;')+' » ? Cette action est définitive.</div><div class="btns"><button class="r" id="cfY">Oui, supprimer</button><button id="cfN">Annuler</button></div>';
 $('cfN').onclick=()=>{c.innerHTML=''};
 $('cfY').onclick=()=>{c.innerHTML='';const r=R();delete r[k];store.set('recs',JSON.stringify(r));if(cur==k){fill({});cur=null}list();say('Enregistrement « '+k+' » supprimé.')}};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rd=(b,o,n)=>n==2?(b[o]|b[o+1]<<8):((b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0);
function parseZip(b){let e=b.length-22;while(rd(b,e,4)!=0x06054b50)e--;const n=rd(b,e+10,2);let p=rd(b,e+16,4);const L=[],dc=new TextDecoder();
 for(let i=0;i<n;i++){const nl=rd(b,p+28,2),xl=rd(b,p+30,2),cl=rd(b,p+32,2),lo=rd(b,p+42,4),cs=rd(b,p+20,4),ln=rd(b,lo+26,2),lx=rd(b,lo+28,2),s0=lo+30+ln+lx;
  L.push({name:dc.decode(b.subarray(p+46,p+46+nl)),fl:rd(b,p+8,2)&~8,m:rd(b,p+10,2),crc:rd(b,p+16,4),us:rd(b,p+24,4),data:b.subarray(s0,s0+cs)});p+=46+nl+xl+cl}
 return L}
function writeZip(L){const en=new TextEncoder(),parts=[],cd=[];let off=0;
 L.forEach(f=>{const nb=en.encode(f.name),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,f.fl,true);h.setUint16(8,f.m,true);h.setUint16(12,0x21,true);h.setUint32(14,f.crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.us,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,f.data);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,f.fl,true);e.setUint16(10,f.m,true);e.setUint16(14,0x21,true);e.setUint32(16,f.crc,true);e.setUint32(20,f.data.length,true);e.setUint32(24,f.us,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+f.data.length});
 const cl=cd.reduce((q,x)=>q+x.length,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,L.length,true);z.setUint16(10,L.length,true);z.setUint32(12,cl,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const strm=async(d,T)=>new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer());
const esc=t=>String(t).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const un=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const CR=ref=>new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');

const CAMSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const CAPMSG='Pour vérification\n\nMerci';
function capImg(){const o=gather(),S=2,W=720,P=24,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
 PN=[['Émission',ELT.slice(0,2)],['Réception',ELT.slice(2,4)],['Relais & autre',ELT.slice(4)]],PH=16+30+2*44+10,H=88+PN.length*PH+(PN.length-1)*16+P;
 const cn=document.createElement('canvas');cn.width=W*S;cn.height=H*S;const c=cn.getContext('2d');c.scale(S,S);
 const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
 const fit=(t,w,px,wt)=>{let q=px;c.font=wt+' '+q+'px '+FF;while(c.measureText(t).width>w&&q>12){q--;c.font=wt+' '+q+'px '+FF}while(t.length>1&&c.measureText(t).width>w)t=t.slice(0,-2)+'…';return t};
 c.fillStyle='#f6f7f9';c.fillRect(0,0,W,H);
 c.fillStyle='#1b1f24';c.font='700 26px '+FF;c.fillText('Constitution',P,P+26);
 const n=new Date(),dd=String(n.getDate()).padStart(2,'0')+'/'+String(n.getMonth()+1).padStart(2,'0')+'/'+n.getFullYear(),
  sub=[o.zone?'Zone n° '+o.zone:'',dd].filter(Boolean).join('  ·  ');
 c.fillStyle='#5d6773';const st=fit(sub,W-2*P,16,500);c.fillText(st,P,P+54);
 PN.forEach(([t,els],i)=>{const y0=88+i*(PH+16);
  c.fillStyle='#fff';rr(P,y0,W-2*P,PH,12);c.fill();c.strokeStyle='#d3d9e0';c.lineWidth=1;c.stroke();
  c.fillStyle='#1b1f24';c.font='700 19px '+FF;c.fillText(t,P+16,y0+36);
  els.forEach(([id,l],j)=>{const y=y0+46+j*44,bx=P+16+190,bw=(W-2*P-32-190-10)/2;
   if(id=='re3'){const on=[1,2,3,4].map(q=>o['c_re3_t'+q]=='oui');let x=P+16;c.font='600 13px '+FF;BPN.forEach((nm,q)=>{const w=c.measureText(nm).width,off=q<3&&(on[3]||(on[0]||on[1]||on[2])&&!on[q]);c.fillStyle=off?'#8b95a1':'#5d6773';c.fillText(nm,x,y+27);if(off){c.strokeStyle='#0000ff';c.lineWidth=2;c.beginPath();c.moveTo(x-1,y+22);c.lineTo(x+w+1,y+22);c.stroke();c.strokeStyle='#d3d9e0';c.lineWidth=1}x+=w+9})}
   else{c.fillStyle='#5d6773';const ll=fit(l,176,17,600);c.fillText(ll,P+16,y+27)}
   [1,2].forEach(q=>{const v=(o['c_'+id+'_'+q]||'').trim(),x=bx+(q-1)*(bw+10);
    c.fillStyle='#f6f7f9';rr(x,y+2,bw,36,8);c.fill();c.strokeStyle='#d3d9e0';c.stroke();
    if(v){c.fillStyle='#1b1f24';const w=fit(v,bw-20,18,600);c.fillText(w,x+10,y+27)}})})});
 return new Promise((ok,ko)=>cn.toBlob(b=>b?ok(b):ko(new Error('image non générée')),'image/png'))}
async function capSend(){say('Préparation de la capture…');
 let blob;try{blob=await capImg()}catch(e){say('Capture impossible : '+e.message);return}
 const o=gather(),z=san(o.zone),name='ITE_constitution_'+(z?z+'_':'')+dstr()+'.png',ti='Constitution'+(o.zone?' - Zone '+o.zone:'');
 try{const f=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:ti,text:CAPMSG});say('Capture partagée.');return}
 }catch(e){if(e&&e.name=='AbortError'){say('Envoi annulé.');return}}
 let saved=false;try{await dl(name,blob);saved=true}catch(e){}
 window.open('mailto:'+(store.get('mail')||'').trim()+'?subject='+encodeURIComponent(ti)+'&body='+encodeURIComponent(CAPMSG),'_top');
 say(saved?'Image enregistrée : joignez-la au message qui s’ouvre.':'Message ouvert, mais l’image n’a pas pu être enregistrée.')}
{const b=document.createElement('button');b.id='bCam';b.className='cam';b.title='Envoyer une capture de la Constitution';b.setAttribute('aria-label','Envoyer une capture');b.innerHTML=CAMSVG;b.onclick=capSend;$('t0').querySelector('.sub').appendChild(b)}
